[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dcf-valuation"
version = "2.1.0"
description = "DCF valuation built from a company's latest SEC 10-K/10-Q filings"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Eleftherios Anastasiou" }]
dependencies = ["pandas>=1.5", "numpy>=1.23", "matplotlib>=3.6", "requests>=2.28",
                "yfinance>=0.2.40", "openpyxl>=3.1", "jinja2>=3.0"]

[project.scripts]
dcf = "dcf.__main__:main"

[tool.setuptools]
packages = ["dcf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
